<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    /* 主色 #f5794f 是亮橘，放在白色分頁列上只有 2.7:1 看不清楚，所以淺色用它的
       shade（--color-brand-hover 那一階，3.4:1）；深色分頁列是深底，才用主色本身。
       兩個值都對應 main.css 的 token，改主色時這裡也要動。 */
    g { stroke: #d86a46 }
    @media (prefers-color-scheme: dark) { g { stroke: #f5794f } }
  </style>
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 9.5h-6v29h6" />
    <path d="M32 9.5h6v29h-6" />
    <path d="M17.5 19.5h11" />
    <path d="M17.5 28.5h6.5" />
  </g>
</svg>
