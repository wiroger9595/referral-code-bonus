<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <!-- viewport-fit=cover 是原生殼裡讓 Ionic 的 safe-area 變數拿得到值的前提，
         少了它 iPhone 上的分頁列會被 home indicator 蓋住。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1020" />
    <title>推薦碼交流站</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
